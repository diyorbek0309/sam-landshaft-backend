# Sam-Landshaft API — Nginx reverse proxy sample
# Joylash: /etc/nginx/sites-available/api.sam-landshaft.uz
# Keyin: ln -s /etc/nginx/sites-available/api.sam-landshaft.uz /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d api.sam-landshaft.uz

# Katta fayl yuklashga ruxsat (2 GB gacha GeoTIFF)
client_max_body_size 2G;
client_body_timeout 600s;

# Upstream
upstream sam_landshaft_api {
    server 127.0.0.1:3000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name api.sam-landshaft.uz;

    # Certbot keyinchalik bu joyni avtomatik 443 ga o'giradi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.sam-landshaft.uz;

    # SSL (certbot tomonidan sozlanadi)
    # ssl_certificate     /etc/letsencrypt/live/api.sam-landshaft.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.sam-landshaft.uz/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 512;

    # COG fayllar uchun alohida — Range request'larni to'g'ri uzatish
    # Katta fayllar uchun buffer kattalashtiriladi
    proxy_buffering off;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://sam_landshaft_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Katta fayllar uchun timeoutlar
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Range requestlarni qo'llab-quvvatlash (COG uchun MUHIM)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range $http_if_range;
    }

    # Health check
    location /health {
        proxy_pass http://sam_landshaft_api/api/health;
        access_log off;
    }

    # Default — 404
    location / {
        return 404;
    }
}
